<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RailFlow · 历史回放</title>
  <meta name="description" content="RailFlow 城市铁路行程历史回放">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23145FE0'/%3E%3Cpath d='M5 17c4-1 5-4 6-7 1-3 3-4 8-3' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip-link" href="#workspace-panel">跳到行程面板</a>

  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="brand" aria-label="RailFlow">
        <svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect width="28" height="28" rx="8" fill="currentColor"></rect>
          <path d="M6 20c4.6-1 5.8-4.6 7-8 1.2-3.4 3.6-4.6 9-3.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"></path>
        </svg>
        <span class="brand-name">RailFlow</span>
      </div>
      <p class="dataset-summary" id="dataset-summary" aria-live="polite">正在读取数据版本…</p>
    </header>

    <aside class="panel" id="workspace-panel" aria-label="城市行程">
      <div class="panel-head" id="panel-head">
        <div class="panel-heading">
          <h1 class="panel-heading-title">城市行程</h1>
          <button type="button" class="button button-secondary replay-panel-toggle" id="panel-toggle" aria-controls="panel-body" aria-expanded="true">收起行程</button>
        </div>
        <div class="panel-tabs" role="tablist" aria-label="行程工作面板">
          <button class="panel-tab" type="button" id="route-tab" role="tab" aria-controls="route-panel" aria-selected="true">路线</button>
          <button class="panel-tab" type="button" id="ai-tab" role="tab" aria-controls="ai-panel" aria-selected="false" tabindex="-1">AI 助手</button>
        </div>
      </div>

      <div class="panel-body" id="panel-body">
        <div id="route-panel" role="tabpanel" aria-labelledby="route-tab">
        <div class="field replay-search">
          <label class="field-label" for="location-search">搜索城市、铁路站或地点</label>
          <input id="location-search" class="date-input" type="search" placeholder="输入城市、站名、站码或地点名" autocomplete="off" aria-controls="location-results place-results" disabled>
          <p class="field-hint">点地图上可选的城市或铁路站，也可直接搜索。</p>
          <div id="city-directory-status" role="status"></div>
          <button class="button button-secondary" id="place-search" type="button" aria-controls="place-results" hidden>搜索高德地点</button>
          <div class="replay-search-results" id="location-results"></div>
          <p class="field-hint" id="place-status" role="status"></p>
          <section id="place-details" class="replay-place-details" aria-label="地点详情" hidden></section>
          <div class="replay-search-results" id="place-results"></div>
        </div>
        <div class="replay-constraints">
          <label class="field"><span class="field-label">出发日期</span><input class="date-input" id="departure-date" type="date" required></label>
          <label class="field"><span class="field-label">参考自然日</span><input class="date-input" id="reference-date" type="date" required></label>
          <label class="field"><span class="field-label">最短换乘间隔（分钟）</span><input class="date-input" id="transfer-minutes" type="number" min="1" max="2147483647" step="1" required></label>
        </div>
        <ol class="replay-nodes" id="itinerary" aria-label="按顺序排列的城市"></ol>
        <p class="query-status" id="query-status" role="status" aria-live="polite"></p>
        <div id="replay-results"></div>
        <details id="dataset-warnings" hidden><summary>数据说明</summary></details>
        </div>
        <section id="ai-panel" class="ai-panel" role="tabpanel" aria-labelledby="ai-tab" hidden>
          <details id="ai-summary" hidden><summary>已知行程条件</summary><p></p></details>
          <div id="ai-log" class="ai-log" role="log" aria-label="AI 助手对话" aria-relevant="additions text"></div>
          <form id="ai-form" class="ai-input-area">
            <p id="ai-status" class="field-hint" role="status"></p>
            <div class="ai-input-row">
              <textarea id="ai-input" class="ai-input" rows="1" maxlength="1000" aria-label="想去哪里？" placeholder="想去哪里？" required></textarea>
              <button id="ai-send" class="button button-primary ai-send" type="submit" disabled>发送</button>
            </div>
          </form>
        </section>
      </div>
    </aside>

    <section class="map-region" id="map-region" aria-label="城市与铁路轨迹地图">
      <div class="map-canvas" id="map-canvas"></div>
      <p class="map-notice" id="map-status" role="status" hidden></p>
      <div class="map-tools" role="group" aria-label="地图工具">
        <button type="button" class="icon-button map-tool" data-map-action="fit" aria-label="查看全程" title="查看全程" data-testid="map-fit">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-button map-tool" data-map-action="zoom-in" aria-label="放大" title="放大" data-testid="map-zoom-in">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-button map-tool" data-map-action="zoom-out" aria-label="缩小" title="缩小" data-testid="map-zoom-out">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="map-source" id="map-source" aria-live="polite"></div>
    </section>

  </div>

  <div id="modal-root"></div>
  <noscript><p class="noscript">需要启用 JavaScript 才能使用 RailFlow。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
