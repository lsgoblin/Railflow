<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title"><title id="title">01  System Structure and Responsibilities</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="930" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">01  System Structure and Responsibilities</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">Target design: browser workspace and monolith; import, geometry and same-origin frontend implemented; planning, product AI and saving still design</text><rect x="50" y="170" width="340" height="180" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">Browser workspace</text><text x="66" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">Native ES Modules</text><text x="66" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">Single store / map adapter</text><text x="66" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">Route, AI, trips panels</text><rect x="530" y="170" width="410" height="330" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="546" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">Spring Boot monolith</text><text x="546" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">Access / Session / ownership</text><text x="546" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">Places / planning services</text><text x="546" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">Dataset version / geometry + fare</text><text x="546" y="305" dominant-baseline="hanging" font-size="18" font-weight="400">AI orchestration and validation</text><text x="546" y="332" dominant-baseline="hanging" font-size="18" font-weight="400">Trip snapshots / simulation records</text><rect x="1080" y="170" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">MySQL 8</text><text x="1096" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">Versioned railway data</text><text x="1096" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">User plans and snapshots</text><text x="1096" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">Conditional update / dedupe</text><rect x="50" y="600" width="340" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="614" dominant-baseline="hanging" font-size="22" font-weight="650">Basemap / SDK</text><text x="66" y="654" dominant-baseline="hanging" font-size="18" font-weight="400">Domain-limited client key</text><text x="66" y="681" dominant-baseline="hanging" font-size="18" font-weight="400">Projection, attribution, fallback</text><rect x="530" y="650" width="410" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="546" y="664" dominant-baseline="hanging" font-size="22" font-weight="650">Fixed GTFS package</text><text x="546" y="704" dominant-baseline="hanging" font-size="18" font-weight="400">Source, version, hash, calendar</text><text x="546" y="731" dominant-baseline="hanging" font-size="18" font-weight="400">Controlled import; fares and cities later</text><rect x="1080" y="440" width="310" height="140" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="454" dominant-baseline="hanging" font-size="22" font-weight="650">External LLM</text><text x="1096" y="494" dominant-baseline="hanging" font-size="18" font-weight="400">Structured proposals / intent</text><text x="1096" y="521" dominant-baseline="hanging" font-size="18" font-weight="400">No SQL or write access</text><rect x="1080" y="660" width="310" height="140" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="674" dominant-baseline="hanging" font-size="22" font-weight="650">Amap place web service</text><text x="1096" y="714" dominant-baseline="hanging" font-size="18" font-weight="400">Other POIs on demand</text><text x="1096" y="741" dominant-baseline="hanging" font-size="18" font-weight="400">Server key / quota and failures</text><polyline points="390,250 530,250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="425" y="220" dominant-baseline="hanging" font-size="16" font-weight="400">/api</text><polyline points="940,250 1080,250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="944" y="217" dominant-baseline="hanging" font-size="16" font-weight="400">MyBatis / SQL</text><polyline points="220,350 220,600" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="465" dominant-baseline="hanging" font-size="16" font-weight="400">JS SDK</text><polyline points="735,650 735,500" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="755" y="565" dominant-baseline="hanging" font-size="16" font-weight="400">Import and validation</text><polyline points="940,400 1010,400 1010,490 1080,490" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="955" y="370" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><polyline points="940,470 980,470 980,715 1080,715" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="985" y="620" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><text x="44" y="865" dominant-baseline="hanging" font-size="18" font-weight="400">Boundary: AI interprets intent; deterministic services verify railway facts. A line is a dependency, not a live integration.</text></g></svg>