<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">02  Deployment and Trust Boundaries</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">02  Deployment and Trust Boundaries</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">Target deployment: same-origin static assets and /api; the MVP already runs this way locally; production settings still need checking</text><rect x="475" y="120" width="480" height="690" rx="10" fill="#ffffff" stroke="#a3afbd" stroke-width="1.5" stroke-dasharray="6 6"/><text x="500" y="134" dominant-baseline="hanging" font-size="18" font-weight="650">Application host (target deployment)</text><rect x="50" y="190" width="330" height="190" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">User browser</text><text x="66" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">Static ES Modules</text><text x="66" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">Session Cookie</text><text x="66" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">HTTPS public environment</text><rect x="510" y="190" width="410" height="290" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="526" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">Spring Boot / Java 17</text><text x="526" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">Same-origin assets and /api</text><text x="526" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">Controllers → domain services</text><text x="526" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">MyBatis / external adapters</text><text x="526" y="325" dominant-baseline="hanging" font-size="18" font-weight="400">Server secrets from environment</text><rect x="1080" y="190" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">Private database node</text><text x="1096" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">MySQL 8</text><text x="1096" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">Owner / version conditions</text><text x="1096" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">SQL never reaches the browser</text><rect x="510" y="625" width="410" height="145" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="526" y="639" dominant-baseline="hanging" font-size="22" font-weight="650">Import input and local files</text><text x="526" y="679" dominant-baseline="hanging" font-size="18" font-weight="400">Fixed GTFS package / raw coordinates</text><text x="526" y="706" dominant-baseline="hanging" font-size="18" font-weight="400">Queries published after validation</text><rect x="1080" y="590" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="604" dominant-baseline="hanging" font-size="22" font-weight="650">External services</text><text x="1096" y="644" dominant-baseline="hanging" font-size="18" font-weight="400">LLM: structured proposals</text><text x="1096" y="671" dominant-baseline="hanging" font-size="18" font-weight="400">Amap web service: POIs</text><text x="1096" y="698" dominant-baseline="hanging" font-size="18" font-weight="400">HTTPS; timeout and quota caps</text><rect x="50" y="625" width="330" height="145" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="639" dominant-baseline="hanging" font-size="22" font-weight="650">Browser basemap SDK</text><text x="66" y="679" dominant-baseline="hanging" font-size="18" font-weight="400">Domain-limited client key</text><text x="66" y="706" dominant-baseline="hanging" font-size="18" font-weight="400">Attribution preserved</text><polyline points="380,280 510,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">Same-origin</text><polyline points="920,280 1080,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="925" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">Private SQL</text><polyline points="715,625 715,480" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="735" y="545" dominant-baseline="hanging" font-size="16" font-weight="400">Import</text><polyline points="920,415 1000,415 1000,670 1080,670" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1009" y="526" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><polyline points="215,380 215,625" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="495" dominant-baseline="hanging" font-size="16" font-weight="400">Map resources</text><text x="44" y="845" dominant-baseline="hanging" font-size="18" font-weight="400">Pre-deployment checks: HTTPS, Cookie/CSRF, domain and quota. The figure is not a runtime or security acceptance result.</text></g></svg>