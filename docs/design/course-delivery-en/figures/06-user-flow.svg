<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">06  Two Entry Points and a Shared User Flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="980" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">06  Two Entry Points and a Shared User Flow</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">Target product flow: map and AI share one trip; the current MVP covers only part of it</text><rect x="50" y="160" width="360" height="140" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="174" dominant-baseline="hanging" font-size="22" font-weight="650">Map / search entry</text><text x="66" y="214" dominant-baseline="hanging" font-size="18" font-weight="400">Full product: pick cities on map</text><text x="66" y="241" dominant-baseline="hanging" font-size="18" font-weight="400">Current MVP: stations, direct, track</text><rect x="50" y="410" width="360" height="140" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">AI entry</text><text x="66" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">State goal / preference / via</text><text x="66" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">Ask first when unclear</text><rect x="540" y="260" width="360" height="165" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="556" y="274" dominant-baseline="hanging" font-size="22" font-weight="650">Shared current trip</text><text x="556" y="314" dominant-baseline="hanging" font-size="18" font-weight="400">City order / stations / dates</text><text x="556" y="341" dominant-baseline="hanging" font-size="18" font-weight="400">Stays / preferences / revision</text><text x="556" y="368" dominant-baseline="hanging" font-size="18" font-weight="400">User conditions vs suggestions</text><rect x="1030" y="260" width="360" height="165" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1046" y="274" dominant-baseline="hanging" font-size="22" font-weight="650">Planning and fact checking</text><text x="1046" y="314" dominant-baseline="hanging" font-size="18" font-weight="400">Historical service days and times</text><text x="1046" y="341" dominant-baseline="hanging" font-size="18" font-weight="400">Real segments / fare sources</text><text x="1046" y="368" dominant-baseline="hanging" font-size="18" font-weight="400">Errors and gaps shown separately</text><rect x="1030" y="590" width="360" height="150" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="1046" y="604" dominant-baseline="hanging" font-size="22" font-weight="650">Compare and map linkage</text><text x="1046" y="644" dominant-baseline="hanging" font-size="18" font-weight="400">Candidate choice / leg detail</text><text x="1046" y="671" dominant-baseline="hanging" font-size="18" font-weight="400">One version drives map and list</text><rect x="540" y="710" width="360" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="556" y="724" dominant-baseline="hanging" font-size="22" font-weight="650">Save / simulation records</text><text x="556" y="764" dominant-baseline="hanging" font-size="18" font-weight="400">Explicit user action, login if needed</text><text x="556" y="791" dominant-baseline="hanging" font-size="18" font-weight="400">Conflict: keep draft; check unknown</text><rect x="50" y="710" width="360" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="724" dominant-baseline="hanging" font-size="22" font-weight="650">Failure and continued editing</text><text x="66" y="764" dominant-baseline="hanging" font-size="18" font-weight="400">Keep input and last valid plan</text><text x="66" y="791" dominant-baseline="hanging" font-size="18" font-weight="400">Recompute after changes</text><polyline points="410,230 470,230 470,320 540,320" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="175" dominant-baseline="hanging" font-size="16" font-weight="400">Add / edit</text><polyline points="410,480 470,480 470,380 540,380" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="505" dominant-baseline="hanging" font-size="16" font-weight="400">Validate before applying</text><polyline points="900,340 1030,340" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="940" y="305" dominant-baseline="hanging" font-size="16" font-weight="400">Query</text><polyline points="1210,425 1210,590" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1230" y="485" dominant-baseline="hanging" font-size="16" font-weight="400">Valid / partial results</text><polyline points="1030,665 960,665 960,785 900,785" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905" y="700" dominant-baseline="hanging" font-size="16" font-weight="400">Selected result</text><polyline points="1030,400 990,400 990,635 230,635 230,710" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450" y="600" dominant-baseline="hanging" font-size="16" font-weight="400">No match / failure / unfinished</text><polyline points="410,780 470,780 470,400 540,400" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="422" y="675" dominant-baseline="hanging" font-size="16" font-weight="400">Recompute</text><text x="44" y="917" dominant-baseline="hanging" font-size="18" font-weight="400">Prototype and real capability stay apart: a local draft is not an account save; an AI tab is not a connected model.</text></g></svg>