<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title"><title id="title">03  Journey Planning Domain Structure</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1500" height="1030" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">03  Journey Planning Domain Structure</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">Simplified domain associations; key attributes and constraints in Design Models; numbers are cardinalities</text><rect x="40" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">Account</text><text x="56" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">userId</text><text x="56" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">Session determines the owner</text><rect x="410" y="145" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="426" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">TravelPlan</text><text x="426" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">planId / revision / version</text><text x="426" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">Dates, D0/R0, preference source</text><text x="426" y="253" dominant-baseline="hanging" font-size="18" font-weight="400">Edits mark results stale</text><rect x="780" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="796" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">VisitNode</text><text x="796" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">nodeId / position / cityId</text><text x="796" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">Board/alight station, stay days</text><rect x="1150" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">City</text><text x="1166" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">cityId / name / source</text><text x="1166" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">Local city identity</text><rect x="40" y="410" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Snapshots / simulations</text><text x="56" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">planId / ownerId / requestId</text><text x="56" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">Keeps plan, explanation, source</text><text x="56" y="518" dominant-baseline="hanging" font-size="18" font-weight="400">No seat, no payment</text><rect x="410" y="410" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="426" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Candidate</text><text x="426" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">candidateId / forRevision</text><text x="426" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">Ordered legs, transfers, time</text><rect x="780" y="410" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="796" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Leg</text><text x="796" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">from/to / board and alight seq</text><text x="796" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">Full times / source references</text><text x="796" y="518" dominant-baseline="hanging" font-size="18" font-weight="400">Geometry, time, fare kept apart</text><rect x="1150" y="410" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Station</text><text x="1166" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">stationId / cityId / CRS</text><text x="1166" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">One entity for all services</text><rect x="40" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">DatasetVersion</text><text x="56" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">Source/hash/coverage/import</text><text x="56" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">Fixed version and calendar</text><rect x="410" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="426" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">TrainInstance</text><text x="426" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">version + tripId + serviceDay</text><text x="426" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">Train number is not an identity</text><rect x="780" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="796" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">GeometryRef</text><text x="796" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">shapeId / segment / verification</text><text x="796" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">Missing or ambiguous: no line</text><rect x="1150" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">HistoricalFare</text><text x="1166" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">Segment/class/version/source</text><text x="1166" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">Unknown amount / currency</text><polyline points="350,225 410,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="355" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="720,225 780,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="725" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1090,225 1150,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1095" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">* : 1</text><polyline points="565,320 565,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="580" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="450,320 450,365 195,365 195,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">Plan snapshots</text><polyline points="720,495 780,495" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="725" y="465" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1305,320 1305,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1320" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1090,540 1150,540" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="350,770 410,770" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="355" y="740" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="850,585 850,632 565,632 565,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="600" dominant-baseline="hanging" font-size="16" font-weight="400">* : 1  train run</text><polyline points="990,585 990,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1005" y="625" dominant-baseline="hanging" font-size="16" font-weight="400">0..1</text><polyline points="1060,585 1060,650 1305,650 1305,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1160" y="618" dominant-baseline="hanging" font-size="16" font-weight="400">0..1  segment fare</text><text x="44" y="930" dominant-baseline="hanging" font-size="19" font-weight="400">Invariants: every segment binds a dataset version and a run instance; splitting one instance never adds a transfer; restore keeps date anchors.</text><text x="44" y="971" dominant-baseline="hanging" font-size="18" font-weight="400">User writes use owner + expected version + request identity; fields and database migrations still need contract review.</text></g></svg>