<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">02  部署与信任边界</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">02  部署与信任边界</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">课程目标部署：同源静态资源与 /api；本轮 MVP 已在本机以同源方式落地，生产参数待部署前核对</text><rect x="475" y="120" width="480" height="690" rx="10" fill="#ffffff" stroke="#a3afbd" stroke-width="1.5" stroke-dasharray="8 6"/><text x="500" y="134" dominant-baseline="hanging" font-size="18" font-weight="650">应用主机（目标部署）</text><rect x="50" y="190" width="330" height="190" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">用户浏览器</text><text x="66" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">静态 ES Modules</text><text x="66" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">Session Cookie</text><text x="66" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">HTTPS 对外环境</text><rect x="510" y="190" width="410" height="290" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="526" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">Spring Boot / Java 17</text><text x="526" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">同源静态资源与 /api</text><text x="526" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">Controllers → 领域服务</text><text x="526" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">MyBatis / 外部适配器</text><text x="526" y="325" dominant-baseline="hanging" font-size="18" font-weight="400">服务端密钥来自环境变量</text><rect x="1080" y="190" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="204" dominant-baseline="hanging" font-size="22" font-weight="650">私有数据库节点</text><text x="1096" y="244" dominant-baseline="hanging" font-size="18" font-weight="400">MySQL 8</text><text x="1096" y="271" dominant-baseline="hanging" font-size="18" font-weight="400">用户属主 / 版本条件</text><text x="1096" y="298" dominant-baseline="hanging" font-size="18" font-weight="400">不向浏览器暴露 SQL</text><rect x="510" y="625" width="410" height="145" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="526" y="639" dominant-baseline="hanging" font-size="22" font-weight="650">导入输入与本地文件</text><text x="526" y="679" dominant-baseline="hanging" font-size="18" font-weight="400">固定 GTFS 包 / 原始坐标</text><text x="526" y="706" dominant-baseline="hanging" font-size="18" font-weight="400">版本校验后发布查询</text><rect x="1080" y="590" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="604" dominant-baseline="hanging" font-size="22" font-weight="650">外部服务</text><text x="1096" y="644" dominant-baseline="hanging" font-size="18" font-weight="400">LLM：结构化提议</text><text x="1096" y="671" dominant-baseline="hanging" font-size="18" font-weight="400">高德 Web 服务：POI</text><text x="1096" y="698" dominant-baseline="hanging" font-size="18" font-weight="400">HTTPS；超时与配额隔离</text><rect x="50" y="625" width="330" height="145" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="639" dominant-baseline="hanging" font-size="22" font-weight="650">浏览器底图 SDK</text><text x="66" y="679" dominant-baseline="hanging" font-size="18" font-weight="400">受域名限制的客户端凭据</text><text x="66" y="706" dominant-baseline="hanging" font-size="18" font-weight="400">服务署名保留</text><polyline points="380,280 510,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="382" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">同源 HTTP(S)</text><polyline points="920,280 1080,280" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="925" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">私有 SQL 连接</text><polyline points="715,625 715,480" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="735" y="545" dominant-baseline="hanging" font-size="16" font-weight="400">导入</text><polyline points="920,415 1000,415 1000,670 1080,670" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1009" y="526" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><polyline points="215,380 215,625" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="495" dominant-baseline="hanging" font-size="16" font-weight="400">地图资源</text><text x="44" y="845" dominant-baseline="hanging" font-size="18" font-weight="400">部署前核对：HTTPS、Cookie / CSRF、域名与配额。图示不是运行或安全验收结论。</text></g></svg>
