<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title"><title id="title">01  系统结构与职责</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="930" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">01  系统结构与职责</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">目标设计：浏览器工作区与单体后端协作；导入、几何与同源前端已实现，规划、产品 AI 与保存仍为设计</text><rect x="50" y="170" width="340" height="180" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">浏览器工作区</text><text x="66" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">原生 ES Modules</text><text x="66" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">单一 store / 地图适配</text><text x="66" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">路线、AI、行程面板</text><rect x="530" y="170" width="410" height="330" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="546" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">Spring Boot 单体应用</text><text x="546" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">接入层 / Session / 属主</text><text x="546" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">地点服务 / 规划服务</text><text x="546" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">数据版本 / 几何与票价适配</text><text x="546" y="305" dominant-baseline="hanging" font-size="18" font-weight="400">AI 编排与提议验证</text><text x="546" y="332" dominant-baseline="hanging" font-size="18" font-weight="400">行程快照 / 模拟记录</text><rect x="1080" y="170" width="310" height="180" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="184" dominant-baseline="hanging" font-size="22" font-weight="650">MySQL 8</text><text x="1096" y="224" dominant-baseline="hanging" font-size="18" font-weight="400">版本化铁路数据</text><text x="1096" y="251" dominant-baseline="hanging" font-size="18" font-weight="400">用户计划与快照</text><text x="1096" y="278" dominant-baseline="hanging" font-size="18" font-weight="400">条件更新 / 请求去重</text><rect x="50" y="600" width="340" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="614" dominant-baseline="hanging" font-size="22" font-weight="650">地图底图 / SDK</text><text x="66" y="654" dominant-baseline="hanging" font-size="18" font-weight="400">浏览器受限客户端凭据</text><text x="66" y="681" dominant-baseline="hanging" font-size="18" font-weight="400">投影、来源署名与降级</text><rect x="530" y="650" width="410" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="546" y="664" dominant-baseline="hanging" font-size="22" font-weight="650">固定 GTFS 数据包</text><text x="546" y="704" dominant-baseline="hanging" font-size="18" font-weight="400">来源、版本、哈希、开行日历</text><text x="546" y="731" dominant-baseline="hanging" font-size="18" font-weight="400">受控导入；票价与城市归属另补</text><rect x="1080" y="440" width="310" height="140" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="454" dominant-baseline="hanging" font-size="22" font-weight="650">外部 LLM</text><text x="1096" y="494" dominant-baseline="hanging" font-size="18" font-weight="400">结构化提议 / 意图解释</text><text x="1096" y="521" dominant-baseline="hanging" font-size="18" font-weight="400">模型无 SQL 或写入权限</text><rect x="1080" y="660" width="310" height="140" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1096" y="674" dominant-baseline="hanging" font-size="22" font-weight="650">高德地点 Web 服务</text><text x="1096" y="714" dominant-baseline="hanging" font-size="18" font-weight="400">其他 POI 按需查询</text><text x="1096" y="741" dominant-baseline="hanging" font-size="18" font-weight="400">服务端密钥 / 配额与失败</text><polyline points="390,250 530,250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="425" y="220" dominant-baseline="hanging" font-size="16" font-weight="400">/api</text><polyline points="940,250 1080,250" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="944" y="217" dominant-baseline="hanging" font-size="16" font-weight="400">MyBatis / SQL</text><polyline points="220,350 220,600" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="240" y="465" dominant-baseline="hanging" font-size="16" font-weight="400">JS SDK</text><polyline points="735,650 735,500" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="755" y="565" dominant-baseline="hanging" font-size="16" font-weight="400">导入与校验</text><polyline points="940,400 1010,400 1010,490 1080,490" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="955" y="370" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><polyline points="940,470 980,470 980,715 1080,715" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="985" y="620" dominant-baseline="hanging" font-size="16" font-weight="400">HTTPS</text><text x="44" y="865" dominant-baseline="hanging" font-size="18" font-weight="400">边界：AI 解释意图，确定性服务核验铁路事实；连接表示依赖，不表示已接通。</text></g></svg>
