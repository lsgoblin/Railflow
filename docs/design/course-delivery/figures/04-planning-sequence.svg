<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title"><title id="title">04  城市组线与规划交互</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="960" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">04  城市组线与规划交互</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">UC-01：固定版本事实 → 有约束的候选 → 对应区间几何；不是运行日志</text><rect x="25" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="41" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">用户</text><polyline points="130,220 130,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="315" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="331" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">前端 store</text><polyline points="420,220 420,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="605" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="621" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">规划服务</text><polyline points="710,220 710,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="895" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="911" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">版本化数据</text><polyline points="1000,220 1000,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="1185" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="1201" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">几何服务</text><polyline points="1290,220 1290,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><polyline points="130,275 420,275" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="148" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">编辑城市 / 日期 / 停留</text><polyline points="420,343 710,343" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="313" dominant-baseline="hanging" font-size="16" font-weight="400">节点、版本、锚点、revision</text><polyline points="710,411 1000,411" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="728" y="381" dominant-baseline="hanging" font-size="16" font-weight="400">匹配站点与有效运行实例</text><polyline points="1000,479 710,479" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="728" y="449" dominant-baseline="hanging" font-size="16" font-weight="400">日历、累计时刻、来源/缺失</text><polyline points="710,547 1290,547" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="728" y="517" dominant-baseline="hanging" font-size="16" font-weight="400">已选车次与乘坐区间</text><polyline points="1290,615 710,615" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="728" y="585" dominant-baseline="hanging" font-size="16" font-weight="400">裁剪轨迹或明确未核实</text><polyline points="710,683 420,683" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="653" dominant-baseline="hanging" font-size="16" font-weight="400">候选 + 时刻/几何/价格状态</text><polyline points="420,751 130,751" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="148" y="721" dominant-baseline="hanging" font-size="16" font-weight="400">同版本列表与地图</text><rect x="44" y="846" width="1352" height="74" rx="10" fill="#f4f7fb" stroke="#a3afbd" stroke-width="1.5"/><text x="62" y="863" dominant-baseline="hanging" font-size="18" font-weight="400">保护：条件变更使旧结果失效；缺几何不补线，价格未知不补零，无匹配与计算未完成分开。</text></g></svg>
