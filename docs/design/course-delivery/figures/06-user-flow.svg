<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">06  两种入口与共同用户流程</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="980" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">06  两种入口与共同用户流程</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">目标产品流程：地图与 AI 共享同一行程；现有 MVP 仅覆盖其中部分交互</text><rect x="50" y="160" width="360" height="140" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="174" dominant-baseline="hanging" font-size="22" font-weight="650">地图 / 搜索入口</text><text x="66" y="214" dominant-baseline="hanging" font-size="18" font-weight="400">完整产品：点选城市组线</text><text x="66" y="241" dominant-baseline="hanging" font-size="18" font-weight="400">当前 MVP：选站、直达、轨迹</text><rect x="50" y="410" width="360" height="140" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="66" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">AI 入口</text><text x="66" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">表达目标 / 偏好 / 途经</text><text x="66" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">信息不足先补问</text><rect x="540" y="260" width="360" height="165" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="556" y="274" dominant-baseline="hanging" font-size="22" font-weight="650">共享当前行程</text><text x="556" y="314" dominant-baseline="hanging" font-size="18" font-weight="400">城市顺序 / 车站 / 日期</text><text x="556" y="341" dominant-baseline="hanging" font-size="18" font-weight="400">停留 / 偏好 / revision</text><text x="556" y="368" dominant-baseline="hanging" font-size="18" font-weight="400">用户条件与建议分开</text><rect x="1030" y="260" width="360" height="165" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1046" y="274" dominant-baseline="hanging" font-size="22" font-weight="650">规划与事实核验</text><text x="1046" y="314" dominant-baseline="hanging" font-size="18" font-weight="400">历史服务日与时刻衔接</text><text x="1046" y="341" dominant-baseline="hanging" font-size="18" font-weight="400">实际铁路区间 / 价格来源</text><text x="1046" y="368" dominant-baseline="hanging" font-size="18" font-weight="400">错误与缺失分别表达</text><rect x="1030" y="590" width="360" height="150" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="1046" y="604" dominant-baseline="hanging" font-size="22" font-weight="650">比较与地图联动</text><text x="1046" y="644" dominant-baseline="hanging" font-size="18" font-weight="400">候选选择 / 分段详情</text><text x="1046" y="671" dominant-baseline="hanging" font-size="18" font-weight="400">同一版本驱动地图和列表</text><rect x="540" y="710" width="360" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="556" y="724" dominant-baseline="hanging" font-size="22" font-weight="650">保存 / 模拟记录</text><text x="556" y="764" dominant-baseline="hanging" font-size="18" font-weight="400">用户显式触发，必要时登录</text><text x="556" y="791" dominant-baseline="hanging" font-size="18" font-weight="400">冲突保留草稿，未知先核对</text><rect x="50" y="710" width="360" height="150" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="66" y="724" dominant-baseline="hanging" font-size="22" font-weight="650">失败与继续编辑</text><text x="66" y="764" dominant-baseline="hanging" font-size="18" font-weight="400">保留输入和旧有效方案</text><text x="66" y="791" dominant-baseline="hanging" font-size="18" font-weight="400">调整条件后重算</text><polyline points="410,230 470,230 470,320 540,320" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="175" dominant-baseline="hanging" font-size="16" font-weight="400">加入/修改</text><polyline points="410,480 470,480 470,380 540,380" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="505" dominant-baseline="hanging" font-size="16" font-weight="400">提议先验证</text><polyline points="900,340 1030,340" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="940" y="305" dominant-baseline="hanging" font-size="16" font-weight="400">查询</text><polyline points="1210,425 1210,590" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1230" y="485" dominant-baseline="hanging" font-size="16" font-weight="400">有效/部分结果</text><polyline points="1030,665 960,665 960,785 900,785" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905" y="700" dominant-baseline="hanging" font-size="16" font-weight="400">选定结果</text><polyline points="1030,400 990,400 990,635 230,635 230,710" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="450" y="600" dominant-baseline="hanging" font-size="16" font-weight="400">无匹配 / 故障 / 条件未完成</text><polyline points="410,780 470,780 470,400 540,400" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="422" y="675" dominant-baseline="hanging" font-size="16" font-weight="400">重算</text><text x="44" y="917" dominant-baseline="hanging" font-size="18" font-weight="400">原型展示与真实能力分开：本地草稿不等于账号保存，AI 页签存在不等于已接通模型。</text></g></svg>
