<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title"><title id="title">05  AI 多轮修改与版本保护</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1440" height="960" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">05  AI 多轮修改与版本保护</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">UC-02：模型只能提出受限修改；实体与事实由确定性服务校验</text><rect x="25" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="41" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">前端 store</text><polyline points="130,220 130,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="315" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="331" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">编排与验证</text><polyline points="420,220 420,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="605" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="621" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">LLM</text><polyline points="710,220 710,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="895" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="911" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">规划服务</text><polyline points="1000,220 1000,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><rect x="1185" y="145" width="210" height="75" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="1201" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">保存后计划</text><polyline points="1290,220 1290,815" fill="none" stroke="#b5bfcb" stroke-width="1.2" stroke-dasharray="6 6"/><polyline points="130,275 420,275" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="148" y="245" dominant-baseline="hanging" font-size="16" font-weight="400">消息 + 草稿快照（draftId/requestId/版本）</text><polyline points="420,343 710,343" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="313" dominant-baseline="hanging" font-size="16" font-weight="400">有限上下文与输出结构</text><polyline points="710,411 420,411" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="381" dominant-baseline="hanging" font-size="16" font-weight="400">完整提议 / 补问 / 拒绝</text><polyline points="420,479 1000,479" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="449" dominant-baseline="hanging" font-size="16" font-weight="400">已校验实体、允许字段与条件</text><polyline points="1000,547 420,547" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="438" y="517" dominant-baseline="hanging" font-size="16" font-weight="400">可追溯候选或分段失败</text><polyline points="420,615 130,615" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="148" y="585" dominant-baseline="hanging" font-size="16" font-weight="400">提议返回；前端核对后原子应用</text><polyline points="130,683 1290,683" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="148" y="653" dominant-baseline="hanging" font-size="16" font-weight="400">用户显式保存→更新持久化版本</text><rect x="44" y="846" width="1352" height="74" rx="10" fill="#f4f7fb" stroke="#a3afbd" stroke-width="1.5"/><text x="62" y="863" dominant-baseline="hanging" font-size="18" font-weight="400">保护：校验失败、截断或快照/版本失配不提交；模型不能执行保存/预订；流式文字不逐字符改行程。</text></g></svg>
