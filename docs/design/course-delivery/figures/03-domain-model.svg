<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title"><title id="title">03  行程规划领域结构</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#475569"/></marker></defs><rect width="1500" height="1030" fill="white"/><g font-family="Microsoft YaHei UI,Microsoft YaHei,sans-serif" fill="#183044"><text x="44" y="30" dominant-baseline="hanging" font-size="30" font-weight="650">03  行程规划领域结构</text><text x="44" y="80" dominant-baseline="hanging" font-size="18" font-weight="400">简化领域关联；重要属性与约束见设计模型正文；数字表示关联基数</text><rect x="40" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">Account</text><text x="56" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">userId</text><text x="56" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">Session 确定资源属主</text><rect x="410" y="145" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="426" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">TravelPlan</text><text x="426" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">planId / revision / version</text><text x="426" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">日期与 D0/R0 / 偏好来源</text><text x="426" y="253" dominant-baseline="hanging" font-size="18" font-weight="400">编辑使结果待重算</text><rect x="780" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="796" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">VisitNode</text><text x="796" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">nodeId / position / cityId</text><text x="796" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">到/发站、自然日停留</text><rect x="1150" y="145" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="159" dominant-baseline="hanging" font-size="22" font-weight="650">City</text><text x="1166" y="199" dominant-baseline="hanging" font-size="18" font-weight="400">cityId / 名称 / 来源</text><text x="1166" y="226" dominant-baseline="hanging" font-size="18" font-weight="400">本地维护城市身份</text><rect x="40" y="410" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">快照 / 模拟记录</text><text x="56" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">planId / ownerId / requestId</text><text x="56" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">保留当时方案、解释与来源</text><text x="56" y="518" dominant-baseline="hanging" font-size="18" font-weight="400">模拟不占座、不支付</text><rect x="410" y="410" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="426" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Candidate</text><text x="426" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">candidateId / forRevision</text><text x="426" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">有序乘坐区间、换乘、耗时</text><rect x="780" y="410" width="310" height="175" rx="10" fill="#edf4ff" stroke="#718198" stroke-width="1.5"/><text x="796" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Leg</text><text x="796" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">from/to / 上下车站序</text><text x="796" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">完整发到时刻 / 来源引用</text><text x="796" y="518" dominant-baseline="hanging" font-size="18" font-weight="400">几何、时刻、价格分态</text><rect x="1150" y="410" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="424" dominant-baseline="hanging" font-size="22" font-weight="650">Station</text><text x="1166" y="464" dominant-baseline="hanging" font-size="18" font-weight="400">stationId / cityId / 坐标系</text><text x="1166" y="491" dominant-baseline="hanging" font-size="18" font-weight="400">普速与高铁不重复建站</text><rect x="40" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="56" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">DatasetVersion</text><text x="56" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">来源 / 哈希 / 覆盖 / 导入</text><text x="56" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">固定版本与开行日历</text><rect x="410" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="426" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">TrainInstance</text><text x="426" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">version + tripId + serviceDay</text><text x="426" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">车次字符串不是运行身份</text><rect x="780" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="796" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">GeometryRef</text><text x="796" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">shapeId / 区间 / 验证状态</text><text x="796" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">缺失或歧义不补直线</text><rect x="1150" y="685" width="310" height="175" rx="10" fill="#f4f7fb" stroke="#718198" stroke-width="1.5"/><text x="1166" y="699" dominant-baseline="hanging" font-size="22" font-weight="650">HistoricalFare</text><text x="1166" y="739" dominant-baseline="hanging" font-size="18" font-weight="400">区间 / 席别 / 版本 / 来源</text><text x="1166" y="766" dominant-baseline="hanging" font-size="18" font-weight="400">amount 可未知 / 币种</text><polyline points="350,225 410,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="355" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="720,225 780,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="725" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1090,225 1150,225" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1095" y="195" dominant-baseline="hanging" font-size="16" font-weight="400">* : 1</text><polyline points="565,320 565,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="580" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="450,320 450,365 195,365 195,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="50" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">计划快照</text><polyline points="720,495 780,495" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="725" y="465" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1305,320 1305,410" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1320" y="350" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="1090,540 1150,540" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1091" y="510" dominant-baseline="hanging" font-size="16" font-weight="400">到/发站</text><polyline points="350,770 410,770" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="355" y="740" dominant-baseline="hanging" font-size="16" font-weight="400">1 : *</text><polyline points="850,585 850,632 565,632 565,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="600" dominant-baseline="hanging" font-size="16" font-weight="400">* : 1 运行实例</text><polyline points="990,585 990,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1005" y="625" dominant-baseline="hanging" font-size="16" font-weight="400">0..1</text><polyline points="1060,585 1060,650 1305,650 1305,685" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1160" y="618" dominant-baseline="hanging" font-size="16" font-weight="400">0..1 区间价格</text><text x="44" y="930" dominant-baseline="hanging" font-size="19" font-weight="400">不变式：所有区间绑定版本和运行实例；同一实例拆分展示不增加换乘；恢复保留日期锚点。</text><text x="44" y="971" dominant-baseline="hanging" font-size="18" font-weight="400">用户写入使用属主 + 期望版本 + 请求身份；字段和数据库迁移仍需契约评审。</text></g></svg>
